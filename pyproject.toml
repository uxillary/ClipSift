[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clipsift"
version = "0.1.0"
description = "Privacy-conscious local CCTV review assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "accelerate>=0.34.0",
  "bitsandbytes>=0.43.3",
  "opencv-python>=4.10.0.84",
  "pillow>=10.4.0",
  "torch>=2.4.0",
  "transformers>=4.50.0",
]

[project.optional-dependencies]
test = ["pytest>=8.3.0"]

[project.scripts]
clipsift = "clipsift.cli:main"

[tool.setuptools.packages.find]
include = ["clipsift*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
